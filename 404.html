    #not-found-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 4px;
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    #not-found-link:hover {
      background: white;
      color: #0a0a0a;
      border-color: white;
    }

    @media (max-width: 768px) {
